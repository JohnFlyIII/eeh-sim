[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeh-llm"
version = "3.0.0"
description = "Framework for simulating intelligence differentials in ethical reasoning using LLMs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name="John B. Fly III"}]
requires-python = ">=3.8"
dependencies = [
  "click>=8.1.8,<9",
  "typer>=0.13.0,<0.14",
  "rich>=13.9.2,<14",
  "pyyaml>=6.0.1",
  "matplotlib>=3.8.0",
  "networkx>=3.2",
  "transformers>=4.44,<5",
  "torch>=2.2",
  "accelerate>=0.33",
]
[project.scripts]
eeh-llm = "eeh_llm.__main__:main"
